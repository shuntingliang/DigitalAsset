<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>智慧能源管理 - 单独算法管理（非集成）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f3f5f9; color: #1f2937; font-size: 13px; }
  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --primary-light: #eff6ff;
    --sidebar-bg: #0f172a;
    --sidebar-active: #1e293b;
    --border: #e5e7eb;
    --text-muted: #6b7280;
    --success: #10b981;
    --warning: #f59e0b;
    --danger: #ef4444;
  }

  /* Top Bar */
  .topbar { height: 56px; background: #fff; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
  .topbar-left { display: flex; align-items: center; gap: 14px; }
  .logo { width: 32px; height: 32px; background: linear-gradient(135deg, #2563eb, #06b6d4); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 14px; }
  .title { font-size: 15px; font-weight: 600; color: #0f172a; }
  .topbar-right { display: flex; align-items: center; gap: 16px; }
  .tenant-tag { padding: 4px 12px; background: var(--primary-light); color: var(--primary); border-radius: 20px; font-size: 12px; font-weight: 500; }
  .admin-info { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); }
  .admin-avatar { width: 30px; height: 30px; border-radius: 50%; background: #fbbf24; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 12px; }

  /* Layout */
  .layout { display: flex; min-height: calc(100vh - 56px); }
  .sidebar { width: 240px; background: var(--sidebar-bg); color: #cbd5e1; padding: 16px 10px; }
  .content { flex: 1; padding: 20px; overflow-y: auto; }

  /* Menu */
  .menu-group { margin-bottom: 6px; }
  .menu-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; cursor: pointer; transition: all .2s; font-size: 13px; color: #cbd5e1; }
  .menu-item:hover { background: var(--sidebar-active); }
  .menu-item.active { background: var(--primary); color: #fff; }
  .menu-item .badge { min-width: 22px; height: 22px; border-radius: 6px; background: rgba(255,255,255,.1); display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; padding: 0 6px; }
  .menu-item.active .badge { background: rgba(255,255,255,.25); }

  /* Content page */
  .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .page-title { font-size: 18px; font-weight: 600; color: #0f172a; }

  /* Toolbar */
  .toolbar { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .toolbar input[type="text"], .toolbar select { padding: 7px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; outline: none; transition: border .2s; background: #fff; min-width: 160px; }
  .toolbar input:focus, .toolbar select:focus { border-color: var(--primary); }

  /* Buttons */
  .btn { padding: 7px 14px; border-radius: 6px; border: 1px solid transparent; font-size: 13px; cursor: pointer; transition: all .2s; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-default { background: #fff; border-color: var(--border); color: #374151; }
  .btn-default:hover { border-color: var(--primary); color: var(--primary); }
  .btn-success { background: var(--success); color: #fff; }
  .btn-success:hover { opacity: .9; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { opacity: .9; }
  .btn-sm { padding: 4px 10px; font-size: 12px; }
  .btn-link { background: transparent; border: none; color: var(--primary); padding: 2px 6px; cursor: pointer; font-size: 12px; }
  .btn-link:hover { text-decoration: underline; }
  .btn-link.danger { color: var(--danger); }

  /* Table */
  .table-wrap { background: #fff; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: #f8fafc; padding: 12px 14px; text-align: left; font-weight: 600; color: #374151; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 11px 14px; border-bottom: 1px solid #f1f5f9; color: #374151; }
  tr:hover td { background: #fafbfc; }
  .text-muted { color: var(--text-muted); }
  .row-actions { white-space: nowrap; }

  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.5); display: none; align-items: flex-start; justify-content: center; padding: 40px 20px; overflow-y: auto; z-index: 100; }
  .modal-overlay.show { display: flex; }
  .modal { background: #fff; border-radius: 12px; width: 100%; max-width: 860px; box-shadow: 0 20px 60px rgba(0,0,0,.15); overflow: hidden; animation: modalIn .2s ease; align-self: flex-start; margin-bottom: 40px; }
  .modal-lg { max-width: 1040px; }
  .modal-xl { max-width: 1200px; }
  .modal-full { max-width: 1440px; }
  @keyframes modalIn { from { transform: translateY(-16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-header { padding: 16px 22px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: linear-gradient(135deg, #f8fafc, #fff); }
  .modal-title { font-size: 16px; font-weight: 600; color: #0f172a; }
  .modal-close { width: 30px; height: 30px; border-radius: 6px; border: none; background: transparent; cursor: pointer; font-size: 18px; color: #6b7280; display: flex; align-items: center; justify-content: center; }
  .modal-close:hover { background: #f1f5f9; color: #0f172a; }
  .modal-body { padding: 18px 22px; max-height: 65vh; overflow-y: auto; }
  .modal-footer { padding: 14px 22px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }

  /* Accordion */
  .accordion { display: flex; flex-direction: column; gap: 8px; }
  .acc-item { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .acc-head { padding: 12px 16px; background: linear-gradient(135deg, #f8fafc, #fff); cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: 600; color: #0f172a; user-select: none; }
  .acc-head .arrow { transition: transform .25s; color: var(--primary); font-size: 12px; }
  .acc-item.open .acc-head .arrow { transform: rotate(180deg); }
  .acc-item.open .acc-head { background: linear-gradient(135deg, #eff6ff, #fff); border-bottom: 1px solid var(--border); }
  .acc-item.open .acc-body { display: block; }
  .acc-body { display: none; padding: 16px; }

  /* Form grid */
  .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px 18px; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group.full { grid-column: 1 / -1; }
  .form-label { font-size: 12px; color: #475569; font-weight: 500; }
  .form-label .unit { color: var(--text-muted); font-weight: 400; font-size: 11px; margin-left: 4px; }
  .form-label .en { color: #94a3b8; font-size: 11px; font-weight: 400; margin-left: 4px; }
  .form-group input, .form-group select { padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; outline: none; transition: border .2s; background: #fff; font-family: inherit; }
  .form-group input:focus, .form-group select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
  .form-group input[readonly] { background: #f8fafc; color: #6b7280; cursor: not-allowed; }
  .form-group .checkbox-wrap { display: flex; align-items: center; gap: 8px; padding-top: 3px; }
  .form-group .checkbox-wrap input { width: 16px; height: 16px; cursor: pointer; }

  /* Tabs */
  .tab-nav { display: flex; gap: 4px; background: #f1f5f9; padding: 4px; border-radius: 10px; margin-bottom: 16px; overflow-x: auto; }
  .tab { flex: 0 0 auto; padding: 8px 20px; cursor: pointer; font-size: 13px; color: #475569; border-radius: 8px; transition: all .2s; font-weight: 500; white-space: nowrap; user-select: none; }
  .tab:hover { color: var(--primary); background: rgba(37,99,235,.06); }
  .tab.active { background: #fff; color: var(--primary); font-weight: 600; box-shadow: 0 1px 4px rgba(15,23,42,.12); }
  .tab .tab-count { display: inline-block; margin-left: 6px; padding: 0 6px; height: 16px; line-height: 16px; border-radius: 8px; background: rgba(100,116,139,.15); font-size: 11px; font-weight: 500; color: #64748b; }
  .tab.active .tab-count { background: rgba(37,99,235,.12); color: var(--primary); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* Status tag */
  .status-tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 500; }
  .status-on { background: #d1fae5; color: #065f46; }
  .status-off { background: #fee2e2; color: #991b1b; }
  .status-draft { background: #fef3c7; color: #92400e; }

  /* Editable table */
  .table-scroll { width: 100%; overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; background: #fff; }
  .editable-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12.5px; }
  .editable-table th { position: sticky; top: 0; z-index: 1; background: #f8fafc; padding: 10px 12px; text-align: left; font-size: 12px; font-weight: 600; color: #475569; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .editable-table td { padding: 7px 12px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; color: #334155; white-space: nowrap; }
  .editable-table tbody tr:last-child td { border-bottom: none; }
  .editable-table tbody tr:hover td { background: #fbfdff; }
  .editable-table td.col-id { font-weight: 600; color: #0f172a; }
  .editable-table td.col-actions { text-align: right; }
  .editable-table td.col-actions .btn + .btn { margin-left: 6px; }
  .editable-table input,
  .editable-table select { width: 100%; min-width: 76px; padding: 6px 8px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 12px; background: #fff; color: #334155; font-family: inherit; outline: none; transition: border .2s, box-shadow .2s; }
  .editable-table input:focus,
  .editable-table select:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(37,99,235,.12); }
  .editable-table input[readonly] { background: #f8fafc; color: #64748b; }

  /* Utils */
  .icon { display: inline-block; width: 14px; height: 14px; vertical-align: middle; }
  .divider { height: 1px; background: var(--border); margin: 12px 0; }
  .section-note { background: #f0f9ff; border-left: 3px solid var(--primary); padding: 8px 12px; border-radius: 0 6px 6px 0; color: #075985; font-size: 12px; margin-bottom: 10px; }

  .sub-table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .sub-table-title { font-weight: 600; color: #334155; font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .sub-table-title .sub-count { font-weight: 400; font-size: 12px; color: #64748b; background: #f1f5f9; padding: 2px 8px; border-radius: 10px; }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-left">
    <div class="logo">SE</div>
    <div class="title">单独算法管理（非集成）</div>
  </div>
  <div class="topbar-right">
    <div class="tenant-tag">🏢 智慧园区科技</div>
    <div class="admin-info">
      <div class="admin-avatar">张</div>
      <span>张策 · 租户管理员</span>
    </div>
  </div>
</div>

<div class="layout">
  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar"></div>

  <!-- CONTENT -->
  <div class="content" id="content"></div>
</div>

<!-- ================ SCRIPT ================ -->
<script>
/* ---------- MENU ---------- */
const MENU = [
  { key: 'project',   level: '第一层', name: '项目信息',   icon: '📁' },
  { key: 'history',   level: '第二层', name: '历史运行',   icon: '📊' },
  { key: 'algo',      level: '第三层', name: '算法参数配置', icon: '⚙️' },
  { key: 'strategy',  level: '第四层', name: '策略库',     icon: '🧠' },
  { key: 'optimal',   level: '第五层', name: '最优策略',   icon: '🎯' }
];

/* ---------- MOCK DATA ---------- */
const PROJECTS = [
  { id:'P001', name:'智慧园区A栋', area:45000, hvac:38000, orientation:'南', wwr:0.45, occ:0.12, eq:25, light:18 },
  { id:'P002', name:'智慧园区B栋', area:28000, hvac:24000, orientation:'东南', wwr:0.38, occ:0.10, eq:22, light:16 },
  { id:'P003', name:'研发中心一期', area:62000, hvac:55000, orientation:'南', wwr:0.50, occ:0.15, eq:30, light:20 },
  { id:'P004', name:'行政办公楼', area:18000, hvac:15000, orientation:'北', wwr:0.35, occ:0.08, eq:18, light:14 },
];

const HISTORY = [
  { id:'H20250101', load:1250, project:'P001', totalPow:480, cop:2.60, eer:3.12, time:'2025-01-15 14:30' },
  { id:'H20250102', load:980,  project:'P002', totalPow:360, cop:2.72, eer:3.25, time:'2025-01-15 15:00' },
  { id:'H20250103', load:1800, project:'P003', totalPow:720, cop:2.50, eer:3.05, time:'2025-01-15 15:30' },
  { id:'H20250104', load:620,  project:'P004', totalPow:240, cop:2.58, eer:3.18, time:'2025-01-15 16:00' },
];

const ALGO_CONFIGS = [
  { id:'A001', type:'能耗代理+策略生成算法', creator:'张策', createTime:'2025-10-01 10:00', updater:'张策', updateTime:'2025-11-10 14:00' },
  { id:'A002', type:'实时优化算法', creator:'张策', createTime:'2025-10-02 11:00', updater:'李明', updateTime:'2025-11-12 09:30' },
  { id:'A003', type:'负荷预测算法', creator:'李明', createTime:'2025-10-05 09:00', updater:'李明', updateTime:'2025-11-15 16:00' },
];

const STRATEGIES = [
  { id:'S001', name:'冷负荷-高-夏季', source:'算法生成', project:'P001', type:'完整', algo:'A001', creator:'系统', updater:'张策', updateTime:'2025-11-20 10:00' },
  { id:'S002', name:'冷负荷-中-过渡季', source:'手动维护', project:'P001', type:'初始', algo:'A001', creator:'张策', updater:'张策', updateTime:'2025-11-18 15:00' },
  { id:'S003', name:'冷负荷-低-冬季', source:'文件导入', project:'P002', type:'完整', algo:'A001', creator:'李明', updater:'李明', updateTime:'2025-11-15 11:00' },
];

const OPTIMAL = [
  { id:'O001', project:'P001', creator:'实时优化', createTime:'2025-11-26 14:00:00', updater:'实时优化', updateTime:'2025-11-26 14:00:00' },
  { id:'O002', project:'P002', creator:'实时优化', createTime:'2025-11-26 14:00:00', updater:'实时优化', updateTime:'2025-11-26 14:00:00' },
  { id:'O003', project:'P003', creator:'实时优化', createTime:'2025-11-26 14:00:00', updater:'实时优化', updateTime:'2025-11-26 14:00:00' },
];

/* ---------- SIDEBAR ---------- */
function renderSidebar(activeKey) {
  const sb = document.getElementById('sidebar');
  sb.innerHTML = MENU.map((m, i) => `
    <div class="menu-group">
      <div class="menu-item ${m.key === activeKey ? 'active' : ''}" data-key="${m.key}">
        <span class="badge">${m.level.replace(/第.+层/, '').trim() || (i+1)}</span>
        <span>${m.icon}</span>
        <span>${m.level} · ${m.name}</span>
      </div>
    </div>
  `).join('');
  sb.querySelectorAll('.menu-item').forEach(el => {
    el.addEventListener('click', () => render(el.dataset.key));
  });
}

/* ---------- PAGE SWITCH ---------- */
function render(key) {
  renderSidebar(key);
  const c = document.getElementById('content');
  if (key === 'project') c.innerHTML = renderProjectPage();
  else if (key === 'history') c.innerHTML = renderHistoryPage();
  else if (key === 'algo') c.innerHTML = renderAlgoPage();
  else if (key === 'strategy') c.innerHTML = renderStrategyPage();
  else if (key === 'optimal') c.innerHTML = renderOptimalPage();

  // bind row buttons
  bindRowActions();
}

/* ================= PAGE 1: PROJECT ================= */
function renderProjectPage() {
  return `
    <div class="page-header">
      <div class="page-title">项目信息（第一层）</div>
    </div>
    <div class="toolbar">
      <input type="text" placeholder="检索项目ID / 项目名称" id="projSearch" />
      <button class="btn btn-primary btn-sm" onclick="searchTable('projSearch','projectTable')">🔍 检索</button>
      <button class="btn btn-success btn-sm" data-action="project-create">➕ 创建项目信息</button>
    </div>
    <div class="table-wrap">
      <table id="projectTable">
        <thead>
          <tr>
            <th>项目ID</th><th>项目名称</th><th>建筑总面积 (m²)</th><th>空调服务面积 (m²)</th>
            <th>建筑朝向</th><th>窗墙比</th><th>人员密度 (人/m²)</th><th>设备功率密度 (W/m²)</th>
            <th>照明功率密度 (W/m²)</th><th>操作</th>
          </tr>
        </thead>
        <tbody>
          ${PROJECTS.map(p => `
            <tr>
              <td>${p.id}</td><td>${p.name}</td><td>${p.area}</td><td>${p.hvac}</td>
              <td>${p.orientation}</td><td>${p.wwr}</td><td>${p.occ}</td><td>${p.eq}</td><td>${p.light}</td>
              <td class="row-actions">
                <button class="btn-link" data-action="project-edit" data-id="${p.id}">编辑</button>
                <button class="btn-link" data-action="project-view" data-id="${p.id}">查看</button>
                <button class="btn-link danger" data-action="project-delete" data-id="${p.id}">删除</button>
                <button class="btn-link" data-action="project-device" data-id="${p.id}">配置设备概况</button>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}

/* ================= PAGE 2: HISTORY ================= */
function renderHistoryPage() {
  return `
    <div class="page-header">
      <div class="page-title">历史运行（第二层）</div>
    </div>
    <div class="toolbar">
      <input type="text" placeholder="检索运行ID" id="histSearch" />
      <button class="btn btn-primary btn-sm">🔍 检索</button>
      <button class="btn btn-default btn-sm">📥 导入模版下载</button>
      <button class="btn btn-default btn-sm">📤 数据导入</button>
      <button class="btn btn-success btn-sm" data-action="history-create">➕ 创建系统整体运行数据</button>
    </div>
    <div class="table-wrap">
      <table id="historyTable">
        <thead>
          <tr>
            <th>运行ID</th><th>冷负荷 (kW)</th><th>所属项目</th><th>冷源系统总电功率 (kW)</th>
            <th>系统综合能效比 EER</th><th>系统综合性能系数 COP</th><th>运行时间</th><th>操作</th>
          </tr>
        </thead>
        <tbody>
          ${HISTORY.map(h => `
            <tr>
              <td>${h.id}</td><td>${h.load}</td><td>${h.project}</td><td>${h.totalPow}</td>
              <td><span style="color:#059669;font-weight:600">${h.eer}</span></td>
              <td><span style="color:#059669;font-weight:600">${h.cop}</span></td>
              <td>${h.time}</td>
              <td class="row-actions">
                <button class="btn-link" data-action="history-edit" data-id="${h.id}">编辑</button>
                <button class="btn-link" data-action="history-view" data-id="${h.id}">查看</button>
                <button class="btn-link danger" data-action="history-delete" data-id="${h.id}">删除</button>
                <button class="btn-link" data-action="history-detail" data-id="${h.id}">设备运行明细</button>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}

/* ================= PAGE 3: ALGO ================= */
function renderAlgoPage() {
  return `
    <div class="page-header">
      <div class="page-title">算法参数配置（第三层）</div>
    </div>
    <div class="toolbar">
      <input type="text" placeholder="检索算法参数配置ID / 算法类型" />
      <button class="btn btn-primary btn-sm">🔍 检索</button>
      <button class="btn btn-success btn-sm" data-action="algo-create">➕ 创建算法参数配置</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>配置ID</th><th>算法类型</th><th>创建人</th><th>创建时间</th><th>更新人</th><th>更新时间</th><th>操作</th>
          </tr>
        </thead>
        <tbody>
          ${ALGO_CONFIGS.map(a => `
            <tr>
              <td>${a.id}</td><td><span class="status-tag status-draft">${a.type}</span></td>
              <td>${a.creator}</td><td class="text-muted">${a.createTime}</td>

/* ================= MODAL UTILS ================= */
function openModal({title, body, footer, size, hideFooter, onOpen}) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay show';
  overlay.innerHTML = `
    <div class="modal ${size || ''}">
      <div class="modal-header">
        <div class="modal-title">${title}</div>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">${body}</div>
      ${!hideFooter ? `<div class="modal-footer">${footer || `<button class="btn btn-default" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="closeModal();toast('已保存','success')">保存</button>`}</div>` : ''}
    </div>
  `;
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
  document.body.appendChild(overlay);
  if (onOpen) onOpen(overlay);
  // init accordions & tabs within modal
  overlay.querySelectorAll('.acc-head').forEach(h => h.addEventListener('click', () => {
    h.parentElement.classList.toggle('open');
  }));
  overlay.querySelectorAll('.tab').forEach(el => el.addEventListener('click', () => {
    const root = el.closest('.tab-nav');
    if (!root) return;
    const scope = root.parentElement;
    root.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    scope.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    const target = scope.querySelector('.tab-content[data-tab-content="' + el.dataset.tab + '"]');
    if (target) target.classList.add('active');
  }));
}
function closeModal() {
  document.querySelectorAll('.modal-overlay.show').forEach(o => o.remove());
}
function toast(msg, type='info') {
  const t = document.createElement('div');
  const colors = {success:'#10b981',danger:'#ef4444',info:'#2563eb'};
  t.style.cssText = `position:fixed;top:80px;left:50%;transform:translateX(-50%);background:${colors[type]};color:#fff;padding:10px 20px;border-radius:6px;z-index:9999;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.2);transition:all .2s`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = 0; t.style.transform = 'translateX(-50%) translateY(-10px)'; setTimeout(() => t.remove(), 200); }, 1800);
}
function searchTable(inpId, tableId) {
  const val = document.getElementById(inpId).value.toLowerCase();
  document.querySelectorAll('#'+tableId+' tbody tr').forEach(tr => {
    tr.style.display = tr.innerText.toLowerCase().includes(val) ? '' : 'none';
  });
}

  } else {
    input = `<input type="text" ${v} placeholder="${type === 'float' || type === 'int' ? '—' : ''}" />`;

  return `<div class="form-group"><label class="form-label">${label}${unit?`<span class="unit">(${unit})</span>`:''}<span class="en">${en}</span></label>${input}</div>`;
};

  const tr = btn.closest('tr');
  const tbody = tr.parentElement;
  tr.remove();
  const key = tbody.id.replace('dev-', '');
  refreshDeviceCount(key);
}

function refreshDeviceCount(key) {
  const tbody = document.getElementById('dev-' + key);
  if (!tbody) return;
  const count = tbody.querySelectorAll('tr').length;
  const panel = tbody.closest('.tab-content');
  const badge = panel && panel.querySelector('.sub-count');
  if (badge) badge.textContent = `共 ${count} 台设备`;
  const tabEl = document.querySelector(`.tab[data-tab="${key}"] .tab-count`);
  if (tabEl) tabEl.textContent = count;
}

    if (idx === 2) return `<td><span class="status-tag ${v ? 'status-on' : 'status-off'}">${v ? '运行' : '停止'}</span></td>`;
    return `<td><input value="${v}" /></td>`;

    <td class="col-actions">
      <button class="btn btn-success btn-sm" onclick="toast('运行数据已保存','success')">保存</button>

      ${accGroup('PID-冷却塔', [

        FORM_FIELD('积分时间','ti_tower_pid','float','s'),

        FORM_FIELD('分位数列表','quantiles','string',''),

      ], readonly)}

        FORM_FIELD('wMAPE达标阈值','mape_threshold','float','%'),
        FORM_FIELD('R²达标阈值','r2_threshold','float',''),
        FORM_FIELD('过拟合gap阈值','overfit_gap_threshold','float',''),
        FORM_FIELD('MAPE近零过滤阈值','mape_min_abs_load','float','kW'),

        FORM_FIELD('漂移告警连续帧数','drift_alert_frames','int','帧'),
      ], readonly)}
    `;
  }
  return {title, body: `<div class="accordion">${groups}</div>`, size:'modal-xl', hideFooter:readonly};
}

    <div class="form-grid" style="margin-bottom:12px">
      <div class="form-group"><label class="form-label">策略ID</label><input value="${id||''}" ${readonly?'readonly':''} /></div>
      <div class="form-group"><label class="form-label">所属项目</label><input value="${readonly?'P001':''}" ${readonly?'readonly':''} /></div>
    </div>
    <div class="accordion">
      ${accGroup('时间与状态', [
        FORM_FIELD('数据采样时间戳','timestamp','datetime',''),
        FORM_FIELD('上一策略是否已执行','strategy_executed','int',''),
      ], readonly, true)}
      ${accGroup('核心工况（必填，缺失返回 400）', [
        FORM_FIELD('当前冷负荷','Q_load','float','kW'),
        FORM_FIELD('冷冻水供水温度（当前值）','t_ch_supply','float','℃'),
        FORM_FIELD('冷源侧冷冻水总流量（当前值）','G_ch_total','float','m³/h'),
        FORM_FIELD('用户侧最小冷冻水流量','G_ch_user_min','float','m³/h'),
      ], readonly)}
      ${accGroup('气象', [
        FORM_FIELD('室外干球温度','t_envir','float','℃'),
        FORM_FIELD('室外相对湿度','RH_envir','float','%'),
        FORM_FIELD('室外湿球温度','t_wb','float','℃'),
      ], readonly)}
      ${accGroup('冷冻水与压差', [
        FORM_FIELD('冷冻水供回水压差（当前值）','delta_P_ch','float','kPa'),
        FORM_FIELD('冷冻水回水温度（当前值）','t_ch_return','float','℃'),
        FORM_FIELD('系统总功率（当前值）','P_total','float','kW'),
      ], readonly)}
      ${accGroup('冷却水', [
        FORM_FIELD('冷却水总流量（当前值）','G_co_total','float','m³/h'),

  `;
  return {title, body, size:'modal-xl', hideFooter:readonly};
}
